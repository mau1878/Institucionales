name: Update institutional data

on:
  schedule:
    # Todos los lunes a las 09:00 UTC (~06:00 ART)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pyarrow

      - name: Run fetch script
        run: python nasdaq_institutional_fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add institutional_holders.parquet general_data.parquet
          git diff --cached --quiet || git commit -m "chore: update institutional data ($(date -u +'%Y-%m-%d'))"
          git push
